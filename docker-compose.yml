services:
  mailpit:
    image: axllent/mailpit:v1.27.8
    profiles: ["mail"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.29.0
    profiles: ["recipes"]
    ports:
      - "127.0.0.1:9925:9000"
    environment:
      ALLOW_SIGNUP: "false"
      BASE_URL: http://localhost:9925
    volumes:
      - mealie_data:/app/data
  postgres:
    image: postgres:16-alpine
    container_name: produktkompass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-produktkompass}
      POSTGRES_USER: ${POSTGRES_USER:-produktkompass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-produktkompass} -d ${POSTGRES_DB:-produktkompass}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    container_name: produktkompass-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      RECOVERY_BASE_URL: ${RECOVERY_BASE_URL:-http://localhost:8080}
      POSTGRES_DB: ${POSTGRES_DB:-produktkompass}
      POSTGRES_USER: ${POSTGRES_USER:-produktkompass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  mealie_data:
