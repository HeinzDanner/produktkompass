<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${company.name} + ' – ProduktKompass'">Unternehmen – ProduktKompass</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container page-content">
    <section class="box">
        <div class="section-header">
            <h1 th:text="${company.name}">Unternehmen</h1>
            <a class="button secondary" th:href="@{/products}">Zurück zum Katalog</a>
        </div>
        <p class="lead" th:text="${company.description}">Beschreibung</p>
    </section>

    <section class="box">
        <h2>Produkte dieses Unternehmens</h2>
        <p th:text="${productPage.totalElements + ' Produkte gefunden'}">Trefferzahl</p>
        <div class="product-grid" th:if="${!#lists.isEmpty(products)}">
            <article class="product-card" th:each="product : ${products}">
                <div th:replace="~{fragments/off-card :: cardHeader(${product}, false)}"></div>
                <div th:replace="~{fragments/product-image :: card(${product})}"></div>
                <div th:replace="~{fragments/off-card :: metadata(${product})}"></div>
                <div th:replace="~{fragments/off-card :: cardDetails(${product})}"></div>
                <div th:replace="~{fragments/cart-panel :: panel(${product.id}, ${product.name})}"></div>
            </article>
        </div>
        <p class="empty-state" th:if="${productPage.totalElements == 0}">Noch keine Produkte hinterlegt.</p>
        <p class="empty-state" th:if="${#lists.isEmpty(products) and productPage.totalElements > 0}">
            Auf dieser Seite gibt es keine Produkte.
            <a th:href="@{/companies/{id}(id=${company.id},size=${productPage.size})}">Zur ersten Seite</a>.
        </p>
        <nav aria-label="Produkte dieses Unternehmens" class="actions">
            <a th:if="${productPage.hasPrevious()}" class="button secondary"
               th:href="@{/companies/{id}(id=${company.id},page=${productPage.number - 1},size=${productPage.size})}">Zurück</a>
            <span th:if="${!#lists.isEmpty(products)}"
                  th:text="${'Seite ' + (productPage.number + 1) + ' von ' + productPage.totalPages}">Seite</span>
            <a th:if="${productPage.hasNext()}" class="button secondary"
               th:href="@{/companies/{id}(id=${company.id},page=${productPage.number + 1},size=${productPage.size})}">Weiter</a>
        </nav>
    </section>
</main>
<script th:src="@{/js/product-images.js}" defer></script>
<script th:src="@{/js/cart.js}" defer></script>
</body>
</html>
