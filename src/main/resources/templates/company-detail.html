<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${company.name} + ' – ProduktKompass'">Unternehmen – ProduktKompass</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container page-content">
    <section class="box">
        <div class="section-header">
            <h1 th:text="${company.name}">Unternehmen</h1>
            <a class="button secondary" th:href="@{/products}">Zurück zum Katalog</a>
        </div>
        <p class="lead" th:text="${company.description}">Beschreibung</p>
    </section>

    <section class="box">
        <h2>Produkte dieses Unternehmens</h2>
        <div class="product-grid" th:if="${!#lists.isEmpty(products)}">
            <article class="product-card" th:each="product : ${products}">
                <h3 th:text="${product.name}">Produktname</h3>
                <p th:text="${product.description}">Beschreibung</p>
                <a class="button secondary" th:href="@{/products/{id}(id=${product.id})}">Produktdetails</a>
            </article>
        </div>
        <p class="empty-state" th:if="${#lists.isEmpty(products)}">Noch keine Produkte hinterlegt.</p>
    </section>
</main>
</body>
</html>
