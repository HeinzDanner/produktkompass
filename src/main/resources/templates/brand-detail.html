<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${brand.name} + ' – ProduktKompass'">Marke – ProduktKompass</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container page-content">
    <section class="box">
        <div class="section-header">
            <h1 th:text="${brand.name}">Marke</h1>
            <a class="button secondary" th:href="@{/products}">Zurück zum Katalog</a>
        </div>
        <p class="lead" th:text="${brand.description}">Beschreibung</p>

        <div class="tag-assign-box" th:if="${userTags != null}">
            <strong>Meine Tags für diese Marke</strong>
            <p class="hint" th:if="${userTags.isEmpty()}">
                Du hast noch keine eigenen Tags. <a th:href="@{/tags}">Jetzt einen Tag anlegen</a>.
            </p>
            <form th:if="${!userTags.isEmpty()}" th:action="@{/tags/brands/{id}(id=${brand.id})}" method="post">
                <div class="tag-assign-options">
                    <label th:each="tag : ${userTags}">
                        <input type="checkbox" name="tagIds" th:value="${tag.id}"
                               th:checked="${assignedTagIds.contains(tag.id)}">
                        <span th:text="${tag.name}">Tag</span>
                    </label>
                </div>
                <button type="submit" class="secondary">Tags speichern</button>
            </form>
        </div>
    </section>

    <section class="box">
        <h2>Produkte dieser Marke</h2>
        <div class="product-grid" th:if="${!#lists.isEmpty(products)}">
            <article class="product-card" th:each="product : ${products}">
                <h3 th:text="${product.name}">Produktname</h3>
                <p th:text="${product.description}">Beschreibung</p>
                <a class="button secondary" th:href="@{/products/{id}(id=${product.id})}">Produktdetails</a>
            </article>
        </div>
        <p class="empty-state" th:if="${#lists.isEmpty(products)}">Noch keine Produkte hinterlegt.</p>
    </section>
</main>
</body>
</html>
