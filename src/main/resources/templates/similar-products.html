<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name} + ' – Ähnliche Produkte'">Ähnliche Produkte</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container page-content">
    <section class="box">
        <div class="section-header">
            <h1 th:text="${product.name} + ' – Ähnliche Produkte'">Ähnliche Produkte</h1>
            <a class="button secondary" th:href="@{/products/{id}(id=${product.id})}">Zur Produktseite</a>
        </div>
        <p class="lead" th:text="${product.description}">Beschreibung</p>
    </section>

    <section class="box">
        <h2>Ursprungsprodukt</h2>
        <div class="product-grid">
            <article class="product-card">
                <div th:replace="~{fragments/off-card :: cardHeader(${product}, false)}"></div>
                <div th:replace="~{fragments/product-image :: card(${product})}"></div>
                <div th:replace="~{fragments/off-card :: metadata(${product})}"></div>
                <div th:replace="~{fragments/off-card :: cardDetails(${product})}"></div>
                <div th:replace="~{fragments/cart-panel :: panel(${product.id}, ${product.name})}"></div>
            </article>
        </div>
    </section>

    <section class="box">
        <h2>Ähnliche Produkte</h2>
        <div class="product-grid" th:if="${!#lists.isEmpty(similarProducts)}">
            <article class="product-card" th:each="alternative : ${similarProducts}">
                <div th:replace="~{fragments/off-card :: cardHeader(${alternative}, false)}"></div>
                <div th:replace="~{fragments/product-image :: card(${alternative})}"></div>
                <div th:replace="~{fragments/off-card :: metadata(${alternative})}"></div>
                <div th:replace="~{fragments/off-card :: cardDetails(${alternative})}"></div>
                <div th:replace="~{fragments/cart-panel :: panel(${alternative.id}, ${alternative.name})}"></div>
            </article>
        </div>
        <p class="empty-state" th:if="${#lists.isEmpty(similarProducts)}">Keine ähnlichen Produkte gefunden.</p>
    </section>
</main>
<script th:src="@{/js/product-images.js}" defer></script>
<script th:src="@{/js/cart.js}" defer></script>
</body>
</html>
