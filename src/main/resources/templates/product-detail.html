<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name} + ' – ProduktKompass'">Produkt – ProduktKompass</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="topbar">
    <div class="container nav-wrap">
        <a class="brand" th:href="@{/}">ProduktKompass</a>
        <div class="nav-links">
            <a th:href="@{/}">Übersicht</a>
            <a th:href="@{/products}">Produkte</a>
            <a th:href="@{/favorites}">Favoriten</a>
            <a th:href="@{/login}">Login</a>
        </div>
    </div>
</nav>

<main class="container page-content">
    <section class="box">
        <div class="section-header">
            <div>
                <p class="eyebrow">Produktdetails</p>
                <h1 th:text="${product.name}">Produktname</h1>
            </div>
            <a class="button secondary" th:href="@{/products}">Zurück zum Katalog</a>
        </div>

        <div class="product-header" style="display:block; margin-bottom:1rem;">
            <span class="badge" th:text="${product.brand != null ? product.brand.name : 'Ohne Marke'}">Marke</span>
        </div>

        <p class="lead" th:text="${product.description != null ? product.description : 'Keine Beschreibung verfügbar.'}">Beschreibung</p>

        <div class="meta-row" th:if="${product.categories != null and !product.categories.isEmpty()}">
            <strong>Kategorien:</strong>
            <span th:each="category : ${product.categories}" th:text="${category.name}">Kategorie</span>
        </div>

        <div class="meta-row" th:if="${product.company != null}">
            <strong>Unternehmen:</strong>
            <span th:text="${product.company != null ? product.company.name : ''}">Unternehmen</span>
        </div>

        <div class="actions" style="margin-top:1.5rem; justify-content:flex-start;">
            <form th:action="@{/favorites/add/{id}(id=${product.id})}" method="post">
                <button type="submit">Als Favorit speichern</button>
            </form>
        </div>
    </section>

    <section class="box" th:if="${product.sources != null and !product.sources.isEmpty()}">
        <h2>Quellen</h2>
        <ul>
            <li th:each="source : ${product.sources}">
                <a th:href="${source.url}" th:text="${source.title}" target="_blank" rel="noopener noreferrer">Quelle</a>
            </li>
        </ul>
    </section>

    <section class="box" th:if="${product.alternativeProducts != null and !product.alternativeProducts.isEmpty()}">
        <h2>Alternative Produkte</h2>
        <div class="product-grid">
            <article class="product-card" th:each="alternative : ${product.alternativeProducts}">
                <div class="product-header">
                    <h3 th:text="${alternative.name}">Alternativprodukt</h3>
                    <span class="badge" th:text="${alternative.brand != null ? alternative.brand.name : 'Ohne Marke'}">Marke</span>
                </div>
                <p th:text="${alternative.description != null ? alternative.description : 'Keine Beschreibung verfügbar.'}">Beschreibung</p>
                <div class="actions">
                    <a class="button secondary" th:href="@{/products/{id}(id=${alternative.id})}">Details</a>
                </div>
            </article>
        </div>
    </section>
</main>
</body>
</html>
