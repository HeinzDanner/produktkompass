<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name} + ' – ProduktKompass'">Produkt – ProduktKompass</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="topbar">
    <div class="container nav-wrap">
        <a class="brand" th:href="@{/}">ProduktKompass</a>
        <div class="nav-links">
            <a th:href="@{/}">Übersicht</a>
            <a th:href="@{/products}">Produkte</a>
            <a th:href="@{/favorites}">Favoriten</a>
            <a th:href="@{/login}">Login</a>
        </div>
    </div>
</nav>

<main class="container page-content">
    <section class="box">
        <div class="section-header">
            <div>
                <p class="eyebrow">Produktdetails</p>
                <h1 th:text="${product.name}">Produktname</h1>
            </div>
            <a class="button secondary" th:href="@{/products}">Zurück zum Katalog</a>
        </div>

        <div class="product-header" style="display:block; margin-bottom:1rem;">
            <a class="badge" th:if="${product.brand != null}" th:href="@{/brands/{id}(id=${product.brand.id})}" th:text="${product.brand.name}">Marke</a>
            <span class="badge" th:if="${product.brand == null}">Ohne Marke</span>
        </div>

        <p class="lead" th:text="${product.description != null ? product.description : 'Keine Beschreibung verfügbar.'}">Beschreibung</p>

        <div class="meta-row" th:if="${product.categories != null and !product.categories.isEmpty()}">
            <strong>Kategorien:</strong>
            <span th:each="category : ${product.categories}" th:text="${category.name}">Kategorie</span>
        </div>

        <div class="meta-row" th:if="${product.company != null}">
            <strong>Unternehmen:</strong>
            <a th:href="@{/companies/{id}(id=${product.company.id})}" th:text="${product.company.name}">Unternehmen</a>
        </div>

        <div class="actions action-group" style="margin-top:1.5rem; justify-content:flex-start;">
            <span class="favorite-icon" th:if="${favoriteProductIds != null and favoriteProductIds.contains(product.id)}">♥</span>
            <form th:if="${favoriteProductIds == null or !favoriteProductIds.contains(product.id)}"
                  th:action="@{/favorites/add/{id}(id=${product.id})}" method="post">
                <button type="submit" class="favorite-toggle">♥ Favorit speichern</button>
            </form>
            <form th:if="${favoriteProductIds != null and favoriteProductIds.contains(product.id)}"
                  th:action="@{/favorites/remove/{id}(id=${product.id})}" method="post">
                <button type="submit" class="secondary favorite-active favorite-toggle">♥ Favorit entfernen</button>
            </form>
            <a class="button secondary" th:href="@{/products/{id}/similar(id=${product.id})}">Ähnliche Produkte</a>
        </div>
    </section>

    <section class="box" th:if="${product.sources != null and !product.sources.isEmpty()}">
        <h2>Quellen</h2>
        <ul>
            <li th:each="source : ${product.sources}">
                <a th:href="${source.url}" th:text="${source.title}" target="_blank" rel="noopener noreferrer">Quelle</a>
            </li>
        </ul>
    </section>

</main>
</body>
</html>
