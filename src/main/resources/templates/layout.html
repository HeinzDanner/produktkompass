<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><th:block th:text="${pageTitle ?: 'ProduktKompass'}">ProduktKompass</th:block></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="topbar">
    <div class="container nav-wrap">
        <a class="brand" th:href="@{/}">ProduktKompass</a>
        <div class="nav-links">
            <a th:href="@{/}">Übersicht</a>
            <a th:href="@{/products}">Produkte</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/favorites}">Favoriten</a>
            <a sec:authorize="!isAuthenticated()" th:href="@{/login}">Login</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit">Logout</button>
            </form>
        </div>
    </div>
</nav>
<main class="container page-content">
    <th:block th:replace="${content}">
        Inhalt
    </th:block>
</main>
</body>
</html>
