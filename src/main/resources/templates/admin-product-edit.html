<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produkt bearbeiten - ProduktKompass</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container page-content">
    <section class="box">
        <h1>Produkt bearbeiten</h1>
        <p><a th:href="@{/admin}">&larr; Zurück zur Admin-Übersicht</a></p>

        <form th:action="@{/admin/products/{id}(id=${productId})}" th:object="${productRequest}" method="post" class="admin-form">
            <div class="form-row">
                <label for="name">Name</label>
                <input id="name" type="text" th:field="*{name}" required>
                <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Fehler</span>
            </div>

            <div class="form-row">
                <label for="description">Beschreibung</label>
                <textarea id="description" th:field="*{description}" rows="4"></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Fehler</span>
            </div>

            <div class="form-row">
                <label for="brandId">Marke</label>
                <select id="brandId" th:field="*{brandId}" th:data-lookup-url="@{/api/v1/brands}" aria-label="Marke">
                    <option value="">Keine Marke</option>
                    <option th:each="brand : ${brandOptions}" th:value="${brand.id}" th:text="${brand.name}"></option>
                </select>
            </div>

            <div class="form-row">
                <label for="companyId">Unternehmen</label>
                <select id="companyId" th:field="*{companyId}" th:data-lookup-url="@{/api/v1/companies}" aria-label="Unternehmen">
                    <option value="">Kein Unternehmen</option>
                    <option th:each="company : ${companyOptions}" th:value="${company.id}" th:text="${company.name}"></option>
                </select>
            </div>

            <div class="form-row">
                <label for="nutritionGrade">Nutri-Score</label>
                <select id="nutritionGrade" th:field="*{nutritionGrade}">
                    <option th:each="grade : ${nutritionGrades}" th:value="${grade}" th:text="${grade}"></option>
                </select>
            </div>

            <div class="form-row">
                <label for="packagingType">Verpackungsart</label>
                <select id="packagingType" th:field="*{packagingType}">
                    <option value="">Keine Angabe</option>
                    <option th:each="packagingType : ${packagingTypes}" th:value="${packagingType}" th:text="${packagingType}"></option>
                </select>
            </div>

            <div class="form-row">
                <label for="packageSize">Packungsgröße</label>
                <input id="packageSize" type="text" th:field="*{packageSize}" placeholder="z. B. 1 l oder 450 g">
            </div>

            <div class="form-row">
                <label for="madeInGermany">Hersteller aus Deutschland</label>
                <select id="madeInGermany" th:field="*{madeInGermany}">
                    <option value="">Keine Angabe</option>
                    <option th:value="true">Ja</option>
                    <option th:value="false">Nein</option>
                </select>
            </div>

            <div class="form-row">
                <label for="containsLactose">Laktose</label>
                <select id="containsLactose" th:field="*{containsLactose}">
                    <option th:each="status : ${ingredientStatuses}" th:value="${status}" th:text="${status}"></option>
                </select>
            </div>

            <div class="form-row">
                <label for="containsGluten">Gluten</label>
                <select id="containsGluten" th:field="*{containsGluten}">
                    <option th:each="status : ${ingredientStatuses}" th:value="${status}" th:text="${status}"></option>
                </select>
            </div>

            <div class="form-row">
                <label for="containsAlcohol">Alkohol</label>
                <select id="containsAlcohol" th:field="*{containsAlcohol}">
                    <option th:each="status : ${ingredientStatuses}" th:value="${status}" th:text="${status}"></option>
                </select>
            </div>

            <div class="form-row">
                <label for="containsCaffeine">Koffein</label>
                <select id="containsCaffeine" th:field="*{containsCaffeine}">
                    <option th:each="status : ${ingredientStatuses}" th:value="${status}" th:text="${status}"></option>
                </select>
            </div>

            <div class="form-row">
                <label for="labels">Labels</label>
                <select id="labels" th:field="*{labels}" multiple="multiple" size="8">
                    <option th:each="label : ${productLabels}" th:value="${label}" th:text="${label}"></option>
                </select>
            </div>

            <div class="form-row">
                <label for="categoryIds">Kategorien</label>
                <select id="categoryIds" th:field="*{categoryIds}" multiple="multiple" size="6" th:data-lookup-url="@{/api/v1/categories}" aria-label="Kategorien">
                    <option th:each="category : ${categoryOptions}" th:value="${category.id}" th:text="${category.name}"></option>
                </select>
            </div>

            <div class="form-row">
                <label for="sourceIds">Quellen</label>
                <select id="sourceIds" th:field="*{sourceIds}" multiple="multiple" size="6" th:data-lookup-url="@{/api/v1/sources}" aria-label="Quellen">
                    <option th:each="source : ${sourceOptions}" th:value="${source.id}" th:text="${source.name}"></option>
                </select>
            </div>

            <div class="form-row">
                <label for="alternativeProductIds">Alternative Produkte</label>
                <label for="alternativeSearch">Weitere Alternativen suchen</label>
                <input id="alternativeSearch" type="search" placeholder="Produktname oder Stichwort">
                <div class="actions" id="alternativePicker" th:attr="data-product-id=${productId}"
                     th:data-search-url="@{/api/v1/products/search}">
                    <button id="alternativeSearchButton" type="button" class="button secondary">Suchen</button>
                    <button id="alternativePrevious" type="button" class="button secondary" disabled>Zurück</button>
                    <button id="alternativeNext" type="button" class="button secondary" disabled>Weiter</button>
                </div>
                <p id="alternativeSearchStatus" class="hint" role="status" aria-live="polite">
                    Die ersten 20 Produkte und bereits gewählte Alternativen werden angezeigt.
                    Zum Laden weiterer Ergebnisse ist JavaScript erforderlich.
                </p>
                <p class="hint">Mehrfachauswahl mit Strg/Cmd. Ausgewählte Produkte bleiben beim Suchen erhalten.</p>
                <select id="alternativeProductIds" th:field="*{alternativeProductIds}" multiple="multiple" size="6">
                    <option th:each="candidate : ${allProducts}"
                            th:if="${candidate.id != productId}"
                            th:value="${candidate.id}" th:text="${candidate.name}"></option>
                </select>
            </div>

            <button type="submit" class="button primary">Änderungen speichern</button>
        </form>
    </section>
</main>
<script th:src="@{/js/alternative-picker.js}" defer></script>
<script th:src="@{/js/lookup-picker.js}" defer></script>
</body>
</html>
