<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produkte – ProduktKompass</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container page-content">
    <section class="box">
        <div class="section-header">
            <h1>Produktkatalog</h1>
            <a class="button" th:href="@{/}">Zur Startseite</a>
        </div>

        <form method="get" th:action="@{/products}" class="product-search catalog-search" aria-label="Katalog durchsuchen">
            <label for="catalogQuery">Produkte suchen</label>
            <input id="catalogQuery" type="search" name="query" th:value="${selectedQuery}"
                   placeholder="Produkt, Marke, Unternehmen oder Kategorie">
            <label for="catalogCategory">Kategorie</label>
            <select id="catalogCategory" name="categoryId" aria-label="Kategorien">
                <option value="" th:selected="${selectedCategoryFilter == ''}">Alle Kategorien</option>
                <option th:each="category : ${catalogCategories}" th:value="${category.id}"
                        th:text="${category.name}" th:selected="${category.id == selectedCategoryId}">Kategorie</option>
            </select>
            <input type="hidden" name="size" th:value="${productPage.size}">
            <input th:if="${selectedBrandId != null}" type="hidden" name="brandId" th:value="${selectedBrandId}">
            <input th:if="${selectedLabel != null}" type="hidden" name="label" th:value="${selectedLabel}">
            <input th:if="${selectedNutritionGrade != null}" type="hidden" name="nutritionGrade" th:value="${selectedNutritionGrade}">
            <input th:if="${selectedMadeInGermany != null}" type="hidden" name="madeInGermany" th:value="${selectedMadeInGermany}">
            <input th:if="${selectedTagId != null}" type="hidden" name="tagId" th:value="${selectedTagId}">
            <input th:if="${includeOpenFoodFactsLabels}" type="hidden" name="includeOpenFoodFactsLabels" value="true">
            <button type="submit" class="button primary">Suchen</button>
        </form>

        <div th:if="${#lists.isEmpty(products)}" class="empty-state">Keine Produkte gefunden.</div>
        <p th:text="${productPage.totalElements + ' Produkte gefunden'}">Trefferzahl</p>

        <div class="product-grid" th:unless="${#lists.isEmpty(products)}">
            <article class="product-card" th:each="product : ${products}">
                <div th:replace="~{fragments/off-card :: cardHeader(${product}, ${favoriteProductIds != null and favoriteProductIds.contains(product.id)})}"></div>
                <div th:replace="~{fragments/product-image :: card(${product})}"></div>
                <div th:replace="~{fragments/off-card :: metadata(${product})}"></div>
                <div th:replace="~{fragments/off-card :: cardDetails(${product})}"></div>
                <div class="actions">
                    <a class="button secondary" th:if="${hasActiveFilter}" th:href="@{/products/{id}/similar(id=${product.id})}">Ähnliche Produkte</a>
                    <form th:if="${favoriteProductIds == null or !favoriteProductIds.contains(product.id)}"
                          th:action="@{/favorites/add/{id}(id=${product.id})}" method="post">
                        <button type="submit" class="favorite-toggle">♥ Favorit hinzufügen</button>
                    </form>
                    <form th:if="${favoriteProductIds != null and favoriteProductIds.contains(product.id)}"
                          th:action="@{/favorites/remove/{id}(id=${product.id})}" method="post">
                        <button type="submit" class="secondary favorite-active favorite-toggle">♥ Favorit entfernen</button>
                    </form>
                </div>
                <div th:replace="~{fragments/cart-panel :: panel(${product.id}, ${product.name})}"></div>
            </article>
        </div>
        <nav aria-label="Ergebnisseiten" class="actions">
            <a th:if="${productPage.hasPrevious()}" class="button secondary"
               th:href="@{/products(query=${selectedQuery},brandId=${selectedBrandId},categoryId=${selectedCategoryFilter},label=${selectedLabel},nutritionGrade=${selectedNutritionGrade},madeInGermany=${selectedMadeInGermany},tagId=${selectedTagId},includeOpenFoodFactsLabels=${includeOpenFoodFactsLabels},page=${productPage.number - 1},size=${productPage.size})}">Zurück</a>
            <span th:if="${productPage.totalPages > 0}"
                  th:text="${'Seite ' + (productPage.number + 1) + ' von ' + productPage.totalPages}">Seite</span>
            <a th:if="${productPage.hasNext()}" class="button secondary"
               th:href="@{/products(query=${selectedQuery},brandId=${selectedBrandId},categoryId=${selectedCategoryFilter},label=${selectedLabel},nutritionGrade=${selectedNutritionGrade},madeInGermany=${selectedMadeInGermany},tagId=${selectedTagId},includeOpenFoodFactsLabels=${includeOpenFoodFactsLabels},page=${productPage.number + 1},size=${productPage.size})}">Weiter</a>
        </nav>
    </section>
</main>
<script th:src="@{/js/product-images.js}" defer></script>
<script th:src="@{/js/cart.js}" defer></script>
</body>
</html>
