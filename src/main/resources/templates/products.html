<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produkte – ProduktKompass</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container page-content">
    <section class="box">
        <div class="section-header">
            <h1>Produktkatalog</h1>
            <a class="button" th:href="@{/}">Zur Startseite</a>
        </div>

        <form method="get" th:action="@{/products}" class="product-search">
            <input type="text" name="query" th:value="${selectedQuery}" placeholder="Produktname oder Stichwort">

            <select name="brandId" th:data-lookup-url="@{/api/v1/brands}" aria-label="Marken">
                <option value="">Alle Marken</option>
                <option th:each="brand : ${brands}"
                        th:value="${brand.id}"
                        th:text="${brand.name}"
                        th:selected="${brand.id == selectedBrandId}">Marke</option>
            </select>

            <select name="categoryId" th:data-lookup-url="@{/api/v1/categories}" aria-label="Kategorien">
                <option value="">Alle Kategorien</option>
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}"
                        th:selected="${category.id == selectedCategoryId}">Kategorie</option>
            </select>

            <select name="label">
                <option value="">Alle Labels</option>
                <option th:each="label : ${productLabels}"
                        th:value="${label}"
                        th:text="${label}"
                        th:selected="${label == selectedLabel}">Label</option>
            </select>

            <select name="nutritionGrade">
                <option value="">Alle Nutri-Scores</option>
                <option th:each="grade : ${nutritionGrades}"
                        th:value="${grade}"
                        th:text="${grade}"
                        th:selected="${grade == selectedNutritionGrade}">Nutri-Score</option>
            </select>

            <select name="madeInGermany">
                <option value="">Alle Herstellerländer</option>
                <option value="true" th:selected="${selectedMadeInGermany == true}">Hersteller aus Deutschland</option>
                <option value="false" th:selected="${selectedMadeInGermany == false}">Nicht aus Deutschland</option>
            </select>

            <select name="tagId" th:if="${userTagOptions != null and !userTagOptions.isEmpty()}">
                <option value="">Alle meine Tags</option>
                <option th:each="tag : ${userTagOptions}"
                        th:value="${tag.id}"
                        th:text="${tag.name}"
                        th:selected="${tag.id == selectedTagId}">Tag</option>
            </select>

            <button type="submit" class="button primary">Filtern</button>
            <a class="button secondary" th:href="@{/products}">Zurücksetzen</a>
        </form>

        <div th:if="${#lists.isEmpty(products)}" class="empty-state">Keine Produkte gefunden.</div>
        <p th:text="${productPage.totalElements + ' Produkte gefunden'}">Trefferzahl</p>

        <div class="product-grid" th:unless="${#lists.isEmpty(products)}">
            <article class="product-card" th:each="product : ${products}">
                <div class="product-header">
                    <h3 th:text="${product.name}">Produktname</h3>
                    <a class="badge" th:if="${product.brand != null}" th:href="@{/brands/{id}(id=${product.brand.id})}" th:text="${product.brand.name}">Marke</a>
                    <span class="badge" th:if="${product.brand == null}">Ohne Marke</span>
                    <span class="favorite-icon" th:if="${favoriteProductIds != null and favoriteProductIds.contains(product.id)}">♥</span>
                </div>
                <p th:text="${product.description}">Beschreibung</p>
                <div class="meta-row" th:if="${product.categories != null and !product.categories.isEmpty()}">
                    <span th:each="category : ${product.categories}" th:text="${category.name}">Kategorie</span>
                </div>
                <div class="meta-row" th:if="${product.company != null}">
                    <a th:href="@{/companies/{id}(id=${product.company.id})}" th:text="${product.company.name}">Unternehmen</a>
                </div>
                <div class="meta-row" th:if="${product.company == null}">
                    <span>Unternehmen unbekannt</span>
                </div>
                <div class="actions">
                    <a class="button secondary" th:href="@{/products/{id}(id=${product.id})}">Details</a>
                    <a class="button secondary" th:if="${hasActiveFilter}" th:href="@{/products/{id}/similar(id=${product.id})}">Ähnliche Produkte</a>
                    <form th:if="${favoriteProductIds == null or !favoriteProductIds.contains(product.id)}"
                          th:action="@{/favorites/add/{id}(id=${product.id})}" method="post">
                        <button type="submit" class="favorite-toggle">♥ Favorit hinzufügen</button>
                    </form>
                    <form th:if="${favoriteProductIds != null and favoriteProductIds.contains(product.id)}"
                          th:action="@{/favorites/remove/{id}(id=${product.id})}" method="post">
                        <button type="submit" class="secondary favorite-active favorite-toggle">♥ Favorit entfernen</button>
                    </form>
                </div>
            </article>
        </div>
        <nav aria-label="Ergebnisseiten" class="actions">
            <a th:if="${productPage.hasPrevious()}" class="button secondary"
               th:href="@{/products(query=${selectedQuery},brandId=${selectedBrandId},categoryId=${selectedCategoryId},label=${selectedLabel},nutritionGrade=${selectedNutritionGrade},madeInGermany=${selectedMadeInGermany},tagId=${selectedTagId},page=${productPage.number - 1},size=${productPage.size})}">Zurück</a>
            <span th:if="${productPage.totalPages > 0}"
                  th:text="${'Seite ' + (productPage.number + 1) + ' von ' + productPage.totalPages}">Seite</span>
            <a th:if="${productPage.hasNext()}" class="button secondary"
               th:href="@{/products(query=${selectedQuery},brandId=${selectedBrandId},categoryId=${selectedCategoryId},label=${selectedLabel},nutritionGrade=${selectedNutritionGrade},madeInGermany=${selectedMadeInGermany},tagId=${selectedTagId},page=${productPage.number + 1},size=${productPage.size})}">Weiter</a>
        </nav>
    </section>
</main>
<script th:src="@{/js/lookup-picker.js}" defer></script>
</body>
</html>
