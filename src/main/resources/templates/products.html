<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produkte – ProduktKompass</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="topbar">
    <div class="container nav-wrap">
        <a class="brand" th:href="@{/}">ProduktKompass</a>
        <div class="nav-links">
            <a th:href="@{/}">Übersicht</a>
            <a th:href="@{/products}">Produkte</a>
            <a th:href="@{/favorites}">Favoriten</a>
            <a th:href="@{/login}">Login</a>
        </div>
    </div>
</nav>
<main class="container page-content">
    <section class="box">
        <div class="section-header">
            <h1>Produktkatalog</h1>
            <a class="button" th:href="@{/}">Zur Startseite</a>
        </div>

        <form method="get" th:action="@{/products}" class="product-search">
            <input type="text" name="query" th:value="${selectedQuery}" placeholder="Produktname oder Stichwort">

            <select name="brandId">
                <option value="">Alle Marken</option>
                <option th:each="brand : ${brands}"
                        th:value="${brand.id}"
                        th:text="${brand.name}"
                        th:selected="${brand.id == selectedBrandId}">Marke</option>
            </select>

            <select name="categoryId">
                <option value="">Alle Kategorien</option>
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}"
                        th:selected="${category.id == selectedCategoryId}">Kategorie</option>
            </select>
            <a class="button secondary" th:href="@{/products}">Zurücksetzen</a>
        </form>

        <div th:if="${#lists.isEmpty(products)}" class="empty-state">Keine Produkte gefunden.</div>

        <div class="product-grid" th:unless="${#lists.isEmpty(products)}">
            <article class="product-card" th:each="product : ${products}">
                <div class="product-header">
                    <h3 th:text="${product.name}">Produktname</h3>
                    <span class="badge" th:text="${product.brand != null ? product.brand.name : 'Ohne Marke'}">Marke</span>
                    <span class="favorite-icon" th:if="${favoriteProductIds != null and favoriteProductIds.contains(product.id)}">♥</span>
                </div>
                <p th:text="${product.description}">Beschreibung</p>
                <div class="meta-row" th:if="${product.categories != null and !product.categories.isEmpty()}">
                    <span th:each="category : ${product.categories}" th:text="${category.name}">Kategorie</span>
                </div>
                <div class="meta-row" th:if="${product.company != null}">
                    <span th:text="${product.company != null ? product.company.name : ''}">Unternehmen</span>
                </div>
                <div class="actions">
                    <a class="button secondary" th:href="@{/products/{id}(id=${product.id})}">Details</a>
                    <form th:if="${favoriteProductIds == null or !favoriteProductIds.contains(product.id)}"
                          th:action="@{/favorites/add/{id}(id=${product.id})}" method="post">
                        <button type="submit" class="favorite-toggle">♥ Favorit hinzufügen</button>
                    </form>
                    <form th:if="${favoriteProductIds != null and favoriteProductIds.contains(product.id)}"
                          th:action="@{/favorites/remove/{id}(id=${product.id})}" method="post">
                        <button type="submit" class="secondary favorite-active favorite-toggle">♥ Favorit entfernen</button>
                    </form>
                </div>
            </article>
        </div>
    </section>
</main>
</body>
</html>
