server:
  # In Produktion läuft die App typischerweise hinter einem Reverse Proxy
  # (z. B. nginx, Traefik), der TLS terminiert und X-Forwarded-*-Header setzt.
  # "framework" sorgt dafür, dass Spring diese Header auswertet (u. a. für
  # korrekte https-Redirect-URLs), ohne dass die App selbst ein TLS-Zertifikat
  # benötigt.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax

spring:
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

logging:
  level:
    root: WARN
    de.heinzdanner.produktkompass: INFO

produktkompass:
  security:
    recovery:
      base-url: ${RECOVERY_BASE_URL}
      from: ${RECOVERY_MAIL_FROM}
