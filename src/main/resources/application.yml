spring:
  application:
    name: produktkompass

  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

produktkompass:
  open-food-facts:
    cards:
      max-labels: 3
  user-tags:
    # Maximale Anzahl eigener Tags, die ein Benutzer anlegen darf.
    max-per-user: 5