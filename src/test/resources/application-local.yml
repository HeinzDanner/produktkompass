server:
  port: 8082

produktkompass:
  security:
    rate-limiting:
      # Other integration tests share one client address; rate-limit tests explicitly enable this.
      enabled: false

spring:
  # Jeder Testkontext bekommt eine eigene, isolierte H2-In-Memory-Datenbank.
  # Ohne den zufälligen Namensteil würden mehrere Spring-Kontexte (z. B. ein
  # reiner @SpringBootTest und einer mit @AutoConfigureMockMvc) dieselbe
  # In-Memory-DB teilen und sich beim erneuten Ausführen der Daten-Initializer
  # gegenseitig stören.
  datasource:
    url: jdbc:h2:mem:produktkompassdb-test-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false
